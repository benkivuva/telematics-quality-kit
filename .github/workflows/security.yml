name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install project
        run: uv sync
      - name: Install security tools
        run: python -m pip install pip-audit semgrep
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
      - name: semgrep
        run: semgrep scan --config auto --error
      - name: pip-audit
        run: uv run pip-audit
      - name: Install Trivy
        run: |
          TRIVY_VERSION=0.69.3
          curl --fail --location --retry 3 --retry-delay 5 \
            --output trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --location --retry 3 --retry-delay 5 \
            --output trivy_checksums.txt \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy_checksums.txt | sha256sum --check --
          mkdir -p .trivy
          tar -xzf trivy.tar.gz -C .trivy trivy
          echo "$GITHUB_WORKSPACE/.trivy" >> "$GITHUB_PATH"
      - name: trivy filesystem scan
        run: trivy fs --severity CRITICAL,HIGH --exit-code 1 .
