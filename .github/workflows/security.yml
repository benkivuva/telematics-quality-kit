name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
      - name: Install project
        run: uv sync
      - name: Install security tools
        run: python -m pip install pip-audit semgrep
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
      - name: semgrep
        run: semgrep scan --config auto --error
      - name: pip-audit
        run: uv run pip-audit
      - name: Install Trivy
        run: |
          TRIVY_VERSION=0.69.3
          ARCHIVE="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          BASE="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl --fail --location --retry 3 --retry-delay 5 --output "$ARCHIVE" "$BASE/$ARCHIVE"
          curl --fail --location --retry 3 --retry-delay 5 \
            --output trivy_checksums.txt \
            "$BASE/trivy_${TRIVY_VERSION}_checksums.txt"
          grep -F " $ARCHIVE" trivy_checksums.txt | sha256sum --check --strict -
          mkdir -p .trivy
          tar -xzf "$ARCHIVE" -C .trivy trivy
          echo "$GITHUB_WORKSPACE/.trivy" >> "$GITHUB_PATH"
      - name: trivy filesystem scan
        run: trivy fs --severity CRITICAL,HIGH --exit-code 1 .
      - name: Build image for Trivy scan
        run: docker build --tag telematics-quality-kit:security .
      - name: trivy image scan
        run: trivy image --severity CRITICAL,HIGH --exit-code 1 telematics-quality-kit:security
