name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/telematics
      - run: uv run pytest
      - name: CLI smoke
        run: |
          uv run pytest tests/cli
          uv run telematics --help

  quickstart-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build --wheel
      - name: Clean-container quickstart
        shell: bash
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" python:3.12-slim sh -ec '
            python -m pip install --no-cache-dir uv==0.13.7
            WHEEL=$(find /dist -name "*.whl" -print -quit)
            export UV_CACHE_DIR=/tmp/uv-cache
            start=$(date +%s)
            uvx --from "$WHEEL" telematics-quality-kit demo
            cold=$(( $(date +%s) - start ))
            test "$cold" -le 30
            start=$(date +%s)
            uvx --from "$WHEEL" telematics-quality-kit demo
            warm=$(( $(date +%s) - start ))
            test "$warm" -le 15
            uvx --from "$WHEEL" telematics-quality-kit doctor
          '

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and run hardened image
        run: |
          docker build -t telematics-quality-kit:ci .
          docker run -d --name tqk -p 127.0.0.1:8000:8000 --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --cap-drop ALL --security-opt no-new-privileges telematics-quality-kit:ci
          trap 'docker rm -f tqk >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if docker inspect --format '{{.State.Health.Status}}' tqk | grep -q healthy; then break; fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' tqk)" = healthy
          docker inspect --format '{{.Config.User}} {{.HostConfig.ReadonlyRootfs}} {{.HostConfig.CapDrop}} {{.HostConfig.SecurityOpt}}' tqk
