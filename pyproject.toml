[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "telematics-quality-kit"
version = "0.1.2"
description = "A deterministic testbed for telematics data quality"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = ["mcp>=2.2.0,<3", "opentelemetry-api>=1.45.1", "PyYAML>=6.0.3,<7"]

[project.scripts]
telematics = "telematics.cli.main:main"
telematics-quality-kit = "telematics.cli.main:main"

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "mypy>=1,<2",
    "pip-audit>=2,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=5,<7",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast tests of individual components",
    "integration: tests across in-process components",
    "property: invariant tests using generated inputs",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

